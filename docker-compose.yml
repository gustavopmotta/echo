services:
  echo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persiste o banco SQLite e as configurações editadas pela interface web
      - ./reflex.db:/app/reflex.db
      - ./config.env:/app/config.env
      - ./uploaded_files:/app/uploaded_files
    # Permite envio de pacotes ICMP (icmplib com privileged=False) dentro do container
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    # Opcional: defina os servidores DNS internos da sua rede para monitorar por hostname
    # dns:
    #   - 192.168.0.1
    #   - 8.8.8.8
    # dns_search:
    #   - mydomain.local
